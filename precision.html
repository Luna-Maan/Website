<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dead Center — a precision game</title>
<style>
  :root{
    --bg: #10141b;
    --panel: #161b24;
    --grid: rgba(125, 211, 252, 0.06);
    --ink: #e7edf5;
    --dim: #7c8a9e;
    --accent: #7dd3fc;
    --accent-dim: #3a6a82;
    --good: #6ee7b7;
    --bad: #fb7185;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    /* fills the viewport, but always leaves room below for the result line + next button */
    --content-w: min(94vw, calc(100vh - 300px), 1000px);
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  body{
    display:flex; flex-direction:column; align-items:center;
    min-height:100%;
    padding: 18px 16px 32px;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
  }

  header{
    width:100%; max-width: var(--content-w);
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom: 6px;
  }
  .wordmark{
    font-family: var(--mono);
    letter-spacing: 0.02em;
    font-size: 15px;
    color: var(--accent);
    text-transform: uppercase;
  }
  .wordmark b{ color: var(--ink); font-weight: 600; }
  .round-counter{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--dim);
  }

  h1{
    width:100%; max-width:var(--content-w);
    font-size: clamp(24px, 4.5vw, 36px);
    font-weight: 700;
    margin: 4px 0 2px;
    letter-spacing: -0.01em;
  }
  .sub{
    width:100%; max-width:var(--content-w);
    color: var(--dim);
    font-size: clamp(14px, 1.6vw, 17px);
    margin-bottom: 18px;
  }

  .stage{
    position:relative;
    width:100%; max-width:var(--content-w);
    aspect-ratio: 1 / 1;
    background: var(--panel);
    border: 1px solid rgba(125,211,252,0.12);
    border-radius: 10px;
    overflow:hidden;
    box-shadow: 0 20px 60px -30px rgba(0,0,0,0.7);
    touch-action: none;
  }
  svg{ display:block; width:100%; height:100%; cursor: crosshair; touch-action: none; }

  .hint-row{
    display:flex; justify-content:space-between; align-items:center;
    width:100%; max-width:var(--content-w); margin-top: 14px;
  }
  .streak{
    font-family: var(--mono); font-size: 12px; color: var(--dim);
  }
  .streak b{ color: var(--accent); font-weight:600; }

  /* result line — no boxed panel, just plain centered text */
  .result{
    width:100%; max-width:var(--content-w);
    margin-top: 18px;
    min-height: 26px;
    text-align:center;
    display:none;
  }
  .result.show{ display:block; animation: rise 240ms ease-out; }
  @keyframes rise{ from{ opacity:0; transform: translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .result-line{
    font-family: var(--mono);
    font-size: clamp(15px, 1.8vw, 18px);
    color: var(--ink);
    margin-bottom: 4px;
  }
  .result-line .verdict-word{ font-weight: 700; }
  .result-line .verdict-word.good{ color: var(--good); }
  .result-line .verdict-word.bad{ color: var(--bad); }
  .result-line .score{ color: var(--accent); font-weight:600; }
  .result-line .pct{ color: var(--dim); }

  button{
    font-family: var(--sans);
    font-weight: 600;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    padding: 11px 20px;
    cursor: pointer;
    transition: transform 100ms ease, background 150ms ease;
  }
  button:active{ transform: scale(0.97); }
  .btn-primary{
    background: var(--accent);
    color: #0a1620;
    margin-top: 18px;
  }
  .btn-primary:hover{ background: #93ddfd; }

  footer{
    margin-top: 20px;
    color: var(--dim);
    font-size: 12px;
    text-align:center;
    max-width: 520px;
    font-family: var(--mono);
  }

  @media (prefers-reduced-motion: reduce){
    .result.show{ animation:none; }
  }
</style>
</head>
<body>

  <header>
    <div class="wordmark"><b>Dead</b> Center</div>
    <div class="round-counter" id="roundCounter">ROUND 01</div>
  </header>

  <h1>Find the midpoint</h1>
  <div class="sub">Press anywhere and drag along the line — your guess snaps to it. Let go to lock it in.</div>

  <div class="stage">
    <svg id="stage" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div class="hint-row">
    <div class="streak">STREAK <b id="streakVal">0</b></div>
    <div class="streak" id="bestVal">BEST —</div>
  </div>

  <div class="result" id="result">
    <div class="result-line" id="resultLine"></div>
    <button class="btn-primary" id="nextBtn">Next line →</button>
  </div>

  <footer>You'll get one honest number: how far off you were, as a share of the line's own length.</footer>

<script>
(function(){
  const svg = document.getElementById('stage');
  const NS = 'http://www.w3.org/2000/svg';
  const VB_W = 600, VB_H = 600;

  const result = document.getElementById('result');
  const resultLine = document.getElementById('resultLine');
  const streakVal = document.getElementById('streakVal');
  const bestVal = document.getElementById('bestVal');
  const roundCounter = document.getElementById('roundCounter');
  const nextBtn = document.getElementById('nextBtn');

  let A = {x:0,y:0}, B = {x:0,y:0};
  let awaitingClick = true;
  let round = 1;
  let streak = 0;
  let best = null;
  let isDragging = false;
  let previewEl = null;
  let lastSnapped = null;

  function rand(min,max){ return Math.random()*(max-min)+min; }

  function clearSvg(){ while(svg.firstChild) svg.removeChild(svg.firstChild); }

  function el(tag, attrs){
    const e = document.createElementNS(NS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function newLine(){
    const margin = 70;
    A = { x: rand(margin, VB_W-margin), y: rand(margin, VB_H-margin) };
    // ensure a decent length and varied angle
    let ang, len;
    do {
      ang = rand(0, Math.PI*2);
      len = rand(180, 420);
      B = { x: A.x + Math.cos(ang)*len, y: A.y + Math.sin(ang)*len };
    } while (B.x < 30 || B.x > VB_W-30 || B.y < 30 || B.y > VB_H-30);

    awaitingClick = true;
    isDragging = false;
    previewEl = null;
    lastSnapped = null;
    result.classList.remove('show');
    roundCounter.textContent = 'ROUND ' + String(round).padStart(2,'0');

    clearSvg();

    const line = el('line', {
      x1:A.x, y1:A.y, x2:B.x, y2:B.y,
      stroke:'#c7d3e0', 'stroke-width':2.5, 'stroke-linecap':'round'
    });
    svg.appendChild(line);

    [A,B].forEach(p=>{
      svg.appendChild(el('circle', {cx:p.x, cy:p.y, r:5, fill:'#0a1620', stroke:'#c7d3e0', 'stroke-width':2}));
    });

    svg.style.cursor = 'crosshair';
  }

  function distance(p,q){ return Math.hypot(p.x-q.x, p.y-q.y); }

  function toStageCoords(evt){
    const rect = svg.getBoundingClientRect();
    const scaleX = VB_W / rect.width;
    const scaleY = VB_H / rect.height;
    return {
      x: (evt.clientX - rect.left) * scaleX,
      y: (evt.clientY - rect.top) * scaleY
    };
  }

  // nearest point on segment AB to a free point P
  function snapToLine(P){
    const abx = B.x-A.x, aby = B.y-A.y;
    const lenSq = abx*abx + aby*aby;
    let t = lenSq === 0 ? 0 : ((P.x-A.x)*abx + (P.y-A.y)*aby) / lenSq;
    t = Math.max(0, Math.min(1, t));
    return { x: A.x + abx*t, y: A.y + aby*t };
  }

  function ensurePreview(){
    if(!previewEl){
      previewEl = el('circle', {r:7, fill:'#0a1620', stroke:'var(--accent)', 'stroke-width':2.5});
      previewEl.style.stroke = '#7dd3fc';
      svg.appendChild(previewEl);
    }
    return previewEl;
  }

  function onPointerDown(evt){
    if(!awaitingClick) return;
    svg.setPointerCapture && svg.setPointerCapture(evt.pointerId);
    isDragging = true;
    const snapped = snapToLine(toStageCoords(evt));
    lastSnapped = snapped;
    const p = ensurePreview();
    p.setAttribute('cx', snapped.x);
    p.setAttribute('cy', snapped.y);
    evt.preventDefault();
  }

  function onPointerMove(evt){
    if(!isDragging) return;
    const snapped = snapToLine(toStageCoords(evt));
    lastSnapped = snapped;
    const p = ensurePreview();
    p.setAttribute('cx', snapped.x);
    p.setAttribute('cy', snapped.y);
    evt.preventDefault();
  }

  function onPointerUp(evt){
    if(!isDragging) return;
    isDragging = false;
    if(!lastSnapped) return;
    submitGuess(lastSnapped);
  }

  function onPointerCancel(evt){
    // the browser hijacked this gesture (e.g. to scroll) — abort, don't submit
    if(!isDragging) return;
    isDragging = false;
    lastSnapped = null;
    if(previewEl){ previewEl.remove(); previewEl = null; }
  }

  function submitGuess(click){
    if(!awaitingClick) return;
    awaitingClick = false;
    if(previewEl){ previewEl.remove(); previewEl = null; }

    const mid = { x:(A.x+B.x)/2, y:(A.y+B.y)/2 };
    const lineLen = distance(A,B);
    const err = distance(click, mid);
    const errPct = err / lineLen; // fraction of line length

    // score: 100 at 0 error, decays to 0 around 18% of line length off
    const score = Math.max(0, Math.round(100 * Math.exp(-errPct * 10)));

    // reveal both the true midpoint and the guess
    svg.appendChild(el('circle', {cx:mid.x, cy:mid.y, r:7, fill:'none', stroke:'#7dd3fc', 'stroke-width':2.5}));
    svg.appendChild(el('circle', {cx:mid.x, cy:mid.y, r:2, fill:'#7dd3fc'}));

    const guessColor = score>=70 ? '#6ee7b7' : '#fb7185';
    svg.appendChild(el('circle', {cx:click.x, cy:click.y, r:6, fill:'none', stroke:guessColor, 'stroke-width':2.5}));
    svg.appendChild(el('circle', {cx:click.x, cy:click.y, r:2, fill:guessColor}));

    svg.style.cursor = 'default';

    // ---- result line ----
    const pctOff = Math.round(errPct * 1000) / 10; // one decimal place
    const judgement = score>=90 ? 'Dead center.' : score>=70 ? 'Close.' : score>=40 ? 'Off.' : 'Way off.';
    const verdictClass = score>=70 ? 'good' : 'bad';
    resultLine.innerHTML =
      '<span class="verdict-word ' + verdictClass + '">' + judgement + '</span>' +
      ' &nbsp;<span class="score">' + score + '/100</span>' +
      ' &nbsp;<span class="pct">off by ' + pctOff + '%</span>';

    if(score >= 70){ streak++; } else { streak = 0; }
    streakVal.textContent = streak;
    if(best === null || score > best){ best = score; bestVal.textContent = 'BEST ' + best; }

    result.classList.add('show');
  }

  svg.addEventListener('pointerdown', onPointerDown);
  svg.addEventListener('pointermove', onPointerMove);
  svg.addEventListener('pointerup', onPointerUp);
  svg.addEventListener('pointercancel', onPointerCancel);

  nextBtn.addEventListener('click', function(){
    round++;
    newLine();
  });

  newLine();
})();
</script>
</body>
</html>
